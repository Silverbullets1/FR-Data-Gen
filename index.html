<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>France Combo Generator</title>
    <style>
        :root { --bg: #0d0d0d; --green: #00ff41; --purple: #aa88ff; }
        body { background-color: var(--bg); color: var(--green); font-family: 'Courier New', monospace; padding: 20px; }
        .container { max-width: 800px; margin: auto; border: 1px solid var(--green); padding: 20px; }
        h3 { text-align: center; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; }
        .credits { text-align: center; margin-bottom: 20px; font-size: 0.9em; }
        .credits a { color: var(--purple); text-decoration: underline; }
        input, select, button { background: #000; border: 1px solid var(--green); color: var(--green); padding: 10px; width: 100%; margin: 5px 0; cursor: pointer; }
        button:hover { background: var(--green); color: #000; }
        #output-area { width: 100%; height: 300px; background: #000; color: #888; border: 1px dashed #333; padding: 10px; margin-top: 10px; resize: vertical; }
    </style>
</head>
<body>
    <main class="container">
        <h3>France Combo Generator</h3>
        <div class="credits">
            Developed by: <a href="https://t.me/Silverbullets_bot" target="_blank">@Silverbullets_bot</a>
        </div>
        
        <input type="number" id="amount" value="5000">
        <select id="format">
            <option value="email:pass">Email:Password</option>
            <option value="user:pass">Username:Password</option>
        </select>
        <button id="generate-btn">[ GENERATE LIST ]</button>
        <button id="download-btn">[ EXPORT ]</button>
        <textarea id="output-area" readonly></textarea>
    </main>

    <script>
        const first = ["jean", "pierre", "luc", "marie", "claire", "sophie", "thomas", "julien", "emilie", "chloe", "nicolas", "camille"];
        const last = ["martin", "bernard", "dubois", "thomas", "robert", "richard", "petit", "durand", "leroy", "moreau", "fontaine"];
        const domains = ['orange.fr', 'free.fr', 'sfr.fr', 'laposte.net', 'hotmail.fr', 'gmail.com'];
        const symbols = ['!', '@', '#', '$', '123', '2023', '2024'];

        function getUser(f, l) {
            const patterns = [`${f}.${l}`, `${f}${l}`, `${f}_${l}`, `${f}${Math.floor(Math.random()*99)}`, `${l}.${f}`, `${f.charAt(0)}${l}`];
            let user = patterns[Math.floor(Math.random() * patterns.length)];
            if(Math.random() > 0.5) user = user.charAt(0).toUpperCase() + user.slice(1);
            return user;
        }

        function getPass(l) {
            const sym = symbols[Math.floor(Math.random() * symbols.length)];
            return `${l.charAt(0).toUpperCase()}${l.slice(1)}${sym}`;
        }

        document.getElementById('generate-btn').addEventListener('click', () => {
            const amount = parseInt(document.getElementById('amount').value);
            const format = document.getElementById('format').value;
            const output = document.getElementById('output-area');
            let results = [];

            for (let i = 0; i < amount; i++) {
                const f = first[Math.floor(Math.random() * first.length)];
                const l = last[Math.floor(Math.random() * last.length)];
                const d = domains[Math.floor(Math.random() * domains.length)];
                
                const user = getUser(f, l);
                const pass = getPass(l);
                
                if(format === 'user:pass') results.push(`${user}:${pass}`);
                else results.push(`${user}@${d}:${pass}`);
            }
            output.value = results.join('\n');
        });

        document.getElementById('download-btn').onclick = () => {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([document.getElementById('output-area').value], {type: 'text/plain'}));
            a.download = 'France_Combos.txt';
            a.click();
        };
    </script>
</body>
</html>
